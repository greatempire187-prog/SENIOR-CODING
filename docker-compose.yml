version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: student_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./seed_db:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: student_management
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: development
      JWT_SECRET: supersecretkey
      CSRF_SECRET: csrf-secret-key
    ports:
      - '3001:3001'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://backend:3001/api
    ports:
      - '4173:4173'
    depends_on:
      - backend

  report-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:3001
      PORT: '4001'
    ports:
      - '4001:4001'
    depends_on:
      - backend

volumes:
  db-data:
